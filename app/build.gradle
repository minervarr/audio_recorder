plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.example.audio_recorder'
    compileSdk 36
    ndkVersion '29.0.14206865'

    defaultConfig {
        applicationId "com.example.audio_recorder"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "0.1"

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17'
            }
        }
    }

    signingConfigs {
        release {
            storeFile file("../bruno.jks")
            storePassword "Tetas//2004//"
            keyAlias "brunoKey"
            keyPassword "Tetas//2004//"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    splits {
        abi {
            enable true
            reset()
            include "arm64-v8a", "x86_64"
            universalApk false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    sourceSets {
        main.assets.srcDirs += "${buildDir}/generated/recorder_assets"
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }
}

def fontDir = layout.buildDirectory.dir("generated/recorder_assets/fonts")
tasks.register("stageRecorderFont", Copy) {
    from("src/main/res/font/cmu_serif_roman.ttf")
    into(fontDir)
    rename { "cmu.ttf" }
}

afterEvaluate {
    def nativeBuildTasks = tasks.matching { it.name.startsWith("buildCMake") }
    tasks.matching { it.name.startsWith("merge") && it.name.endsWith("Assets") }.configureEach {
        dependsOn nativeBuildTasks
        dependsOn "stageRecorderFont"
    }
    // Lint reads the generated assets directory directly, not the merged assets.
    // Task names are mixed case (generateReleaseLintVitalReportModel, lintVitalAnalyzeRelease).
    tasks.matching { it.name.toLowerCase(java.util.Locale.ROOT).contains("lint") }.configureEach {
        dependsOn "stageRecorderFont"
    }
}
